<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spawn Choose</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="background.mp4" type="video/mp4">
    </video>
    <audio id="bg-music" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <audio id="click-sound" preload="auto"><source src="clicksound.wav" type="audio/wav"></audio>

    <button id="sound-btn" class="top-button" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M11 5 6 9H3v6h3l5 4V5Z" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M15 9a4 4 0 0 1 0 6" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M17.5 6.5a8 8 0 0 1 0 11" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span id="sound-text">ხმა</span>
    </button>

    <main class="spawn-panel">
        <div class="panel-highlight"></div>
        <header class="spawn-header">
            <p class="eyebrow">GEORGIAN ROLE PLAY</p>
            <h1>SPAWN CHOOSE</h1>
            <div class="title-line"></div>
            <p class="subtitle">აირჩიე ადგილი, სადაც გინდა თამაში გააგრძელო</p>
        </header>

        <section class="spawn-grid">
            <button class="spawn-card" data-choice="exitpoint-choose" type="button">
                <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 21s6-5.1 6-11a6 6 0 1 0-12 0c0 5.9 6 11 6 11Z" stroke-width="1.6"/><circle cx="12" cy="10" r="2.2" stroke-width="1.6"/></svg></div>
                <div class="card-copy"><span class="card-title">ბოლო ადგილი</span><span class="card-desc">სერვერიდან გასვლის ბოლო პოზიცია</span></div>
                <span class="arrow">→</span>
            </button>

            <button class="spawn-card" data-choice="fraction-choose" type="button">
                <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3" stroke-width="1.6"/><circle cx="17" cy="9" r="2.2" stroke-width="1.6"/><path d="M3.5 20c.4-4 2.7-6.2 5.5-6.2S14 16 14.5 20" stroke-width="1.6"/><path d="M14.4 14.3c3.1-.7 5.5 1.2 6.1 4.7" stroke-width="1.6"/></svg></div>
                <div class="card-copy"><span class="card-title">ფრაქცია</span><span class="card-desc">დასპაუნდი შენი ფრაქციის ბაზაზე</span></div>
                <span class="arrow">→</span>
            </button>

            <button class="spawn-card" data-choice="home-choose" type="button">
                <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11.5 12 4l9 7.5" stroke-width="1.6"/><path d="M5.5 10.3V20h13v-9.7" stroke-width="1.6"/><path d="M10 20v-5h4v5" stroke-width="1.6"/></svg></div>
                <div class="card-copy"><span class="card-title">სახლი</span><span class="card-desc">სახლი / ნაქირავები სახლი / Carhouse</span></div>
                <span class="arrow">→</span>
            </button>

            <button class="spawn-card" data-choice="spawn-choose" type="button">
                <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20h16" stroke-width="1.6"/><path d="M6 20V9l6-4 6 4v11" stroke-width="1.6"/><path d="M9 13h6M9 16h6" stroke-width="1.6"/></svg></div>
                <div class="card-copy"><span class="card-title">მთავარი სპავნი</span><span class="card-desc">ქუჩაში / სერვერის მთავარ Spawn-ზე</span></div>
                <span class="arrow">→</span>
            </button>
        </section>

        <footer class="spawn-footer">
            <span>აირჩიე ერთი ვარიანტი</span>
        </footer>

        <div id="loadingOverlay" class="loading-overlay">
            <span class="loader"></span>
            <p>იტვირთება...</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
